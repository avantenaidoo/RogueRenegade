[package]
name = "rogue-renegade-ide"
version = "0.1.0"
description = "A desktop IDE built with Tauri, React, and Rust"
authors = ["Avante Naidoo <https://github.com/avantenaidoo>"]
edition = "2021"
repository = "https://github.com/avantenaidoo/RogueRenegade"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rogue_renegade_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

tauri = { version = "2.10.1", features = [] } 

# Official plugins (use latest patch versions)
tauri-plugin-fs  = "^2"
tauri-plugin-log = "^2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"

git2 = "0.18"

keyring = "2.0"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"

reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

portable-pty = "0.8"
once_cell = "1.19"
